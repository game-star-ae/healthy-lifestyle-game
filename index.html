<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>HEALTH BATTLE — Survival Arena</title><style>
*{box-sizing:border-box}body{margin:0;background:#080e20;color:white;font:15px system-ui,Arial;overflow:hidden}canvas{display:block;width:100vw;height:100vh;touch-action:none}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:center;pointer-events:none;flex-wrap:wrap}.pill{background:#0b1535d9;border:1px solid #ffffff32;padding:9px 12px;border-radius:12px;backdrop-filter:blur(7px);font-weight:750}.pill b{color:#73f5d2}#tip{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#09132bc9;padding:9px 15px;border-radius:20px;text-align:center;font-size:12px;max-width:95vw}#overlay{position:fixed;inset:0;background:#050b1cbb;display:grid;place-items:center;padding:16px;backdrop-filter:blur(6px)}.panel{width:min(530px,95vw);max-height:90vh;overflow:auto;background:linear-gradient(155deg,#182850,#10182e);border:1px solid #5871a5;border-radius:22px;padding:24px;box-shadow:0 20px 80px #000a;text-align:center}h1{font-size:clamp(29px,6vw,48px);line-height:1.05;margin:4px 0 12px;color:#6ef5d4;text-shadow:0 0 25px #32c6a366}h2{margin:5px 0 12px}p{line-height:1.5;color:#cdd8f5}button{border:0;border-radius:13px;padding:12px 17px;background:#4de3bc;color:#081529;font-weight:900;cursor:pointer;font-size:15px;margin:5px}button:hover{filter:brightness(1.12)}button.secondary{background:#30446c;color:white}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choices button{min-height:94px;margin:0;display:flex;flex-direction:column;justify-content:center;gap:5px}.choices small{font-size:11px;font-weight:500}#toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#111e40e8;border:1px solid #64e8c4;border-radius:14px;padding:11px 16px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}#touch{position:fixed;bottom:50px;left:0;right:0;display:none;justify-content:space-between;padding:15px;pointer-events:none}#touch button{pointer-events:auto;opacity:.8;touch-action:none}#dpad{display:grid;grid-template-columns:repeat(3,48px);gap:2px}#dpad button{margin:0;padding:10px}#shoot{align-self:end;background:#ff737c;color:#25050b;border-radius:50%;height:75px;width:75px}@media(pointer:coarse){#touch{display:flex}#tip{bottom:3px;font-size:10px}#hud{font-size:12px}.pill{padding:6px}}
</style></head><body><canvas id="game"></canvas><div id="hud"><div class="pill">❤️ <b id="hp">100</b></div><div class="pill">🛡️ <b id="armor">0</b></div><div class="pill">🔫 <b id="ammo">12/48</b></div><div class="pill">🥗 <b id="food">0</b></div><div class="pill">🤖 Αντίπαλος <b id="enemy">100</b></div><div class="pill">🚙 <b id="car">Πεζός</b></div></div><div id="toast"></div><div id="tip">WASD / βελάκια: κίνηση · Ποντίκι: στόχευση · Κλικ / Space: βολή · R: γέμισμα · E: κουτί / όχημα · P: παύση</div><div id="touch"><div id="dpad"><span></span><button data-key="ArrowUp">▲</button><span></span><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><div style="display:flex;flex-direction:column"><button id="action">E · ΔΡΑΣΗ</button><button id="reload">R · ΓΕΜΙΣΜΑ</button><button id="shoot">🔥</button></div></div><div id="overlay"><div class="panel" id="panel"></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel');let W,H,scale=1;function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;scale=devicePixelRatio}addEventListener('resize',resize);resize();const world={w:2200,h:1500};const rand=(a,b)=>Math.random()*(b-a)+a;const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let state='menu',p,bot,boxes,cars,bullets,particles,keys={},mouse={x:innerWidth/2,y:innerHeight/2},camera={x:0,y:0},last=0,noticeTime=0,elapsed=0;const hills=Array.from({length:22},()=>({x:rand(70,2100),y:rand(70,1400),r:rand(70,180)}));const rocks=Array.from({length:36},()=>({x:rand(50,2150),y:rand(50,1450),r:rand(12,28)}));const foodList=[{name:'Μήλο',icon:'🍎',good:true,info:'Φρούτο με φυτικές ίνες και βιταμίνες.'},{name:'Γιαούρτι',icon:'🥛',good:true,info:'Πηγή πρωτεΐνης και ασβεστίου.'},{name:'Μπρόκολο',icon:'🥦',good:true,info:'Λαχανικό με βιταμίνες και φυτικές ίνες.'},{name:'Νερό',icon:'💧',good:true,info:'Η ενυδάτωση βοηθά τη φυσιολογική λειτουργία του σώματος.'},{name:'Ξηροί καρποί',icon:'🥜',good:true,info:'Περιέχουν ακόρεστα λιπαρά και θρεπτικά συστατικά.'},{name:'Αναψυκτικό',icon:'🥤',good:false,info:'Τα ζαχαρούχα αναψυκτικά είναι καλύτερα να καταναλώνονται περιστασιακά.'},{name:'Γλυκά',icon:'🍬',good:false,info:'Τα γλυκά μπορούν να υπάρχουν περιστασιακά σε ισορροπημένη διατροφή.'},{name:'Πατατάκια',icon:'🍟',good:false,info:'Συχνά έχουν πολύ αλάτι· προτίμησε ποικιλία τροφών.'}];function start(){p={x:270,y:300,hp:100,armor:0,good:0,ammo:12,reserve:48,maxAmmo:12,power:1,reload:0,fire:0,inCar:-1};bot={x:1850,y:1130,hp:100,fire:0,angle:0};boxes=Array.from({length:16},(_,i)=>({x:rand(200,2000),y:rand(180,1320),used:false,id:i}));cars=[{x:550,y:490},{x:1370,y:760},{x:1900,y:350}];bullets=[];particles=[];elapsed=0;state='play';overlay.style.display='none';toast('Βρες κουτιά! Οι υγιεινές επιλογές σου δίνουν ενισχύσεις.');updateHUD()}
function show(title,body,buttons){state='modal';overlay.style.display='grid';panel.innerHTML='<h2>'+title+'</h2><p>'+body+'</p><div id="actions"></div>';const a=document.getElementById('actions');buttons.forEach(b=>{let el=document.createElement('button');el.textContent=b.label;el.className=b.secondary?'secondary':'';el.onclick=b.fn;a.appendChild(el)})}function menu(){overlay.style.display='grid';state='menu';panel.innerHTML='<div style="font-size:38px">⚡🎮🥗</div><h1>HEALTH BATTLE</h1><h2>SURVIVAL ARENA</h2><p>Μπες στην αρένα, αντιμετώπισε τον AI αντίπαλο, άνοιξε Mystery Boxes και κέρδισε δυνάμεις με έξυπνες διατροφικές επιλογές!</p><p style="font-size:13px">Το παιχνίδι είναι φανταστικό: κανένα μεμονωμένο τρόφιμο δεν καθορίζει από μόνο του την υγεία σου. Η ισορροπία και η ποικιλία έχουν σημασία.</p><button id="start">▶ ΕΝΑΡΞΗ ΜΑΧΗΣ</button>';document.getElementById('start').onclick=start}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;noticeTime=performance.now()+2600}function updateHUD(){document.getElementById('hp').textContent=Math.ceil(Math.max(0,p.hp));document.getElementById('armor').textContent=Math.ceil(p.armor);document.getElementById('ammo').textContent=p.ammo+'/'+p.reserve;document.getElementById('food').textContent=p.good;document.getElementById('enemy').textContent=Math.ceil(Math.max(0,bot.hp));document.getElementById('car').textContent=p.inCar>=0?'Οδηγείς':'Πεζός'}function resume(){state='play';overlay.style.display='none'}function end(win,reason){show(win?'🏆 ΝΙΚΗ!':'💥 GAME OVER',reason+'<br>Υγιεινές επιλογές: '+p.good+' · Χρόνος: '+Math.round(elapsed)+' δευτερόλεπτα',[{label:'↻ ΠΑΙΞΕ ΞΑΝΑ',fn:start},{label:'ΑΡΧΙΚΗ',fn:menu,secondary:true}])}
function openBox(b){if(b.used)return;b.used=true;let foods=[...foodList].sort(()=>Math.random()-.5).slice(0,3);let items=[...foods.map(f=>({label:f.icon+' '+f.name,desc:f.info,food:f})),{label:'🔫 Ενισχυμένο blaster',desc:'Μεγαλύτερη ισχύς βολής.',gun:true},{label:'📦 Πυρομαχικά',desc:'+24 εφεδρικές ενεργειακές βολές.',ammo:true}].sort(()=>Math.random()-.5).slice(0,4);show('🎁 MYSTERY BOX','Διάλεξε ένα αντικείμενο. Οι επιλογές έχουν συνέπειες μόνο μέσα στο παιχνίδι!',[]);let div=document.getElementById('actions');div.className='choices';items.forEach(item=>{let b=document.createElement('button');b.innerHTML=item.label+'<small>'+item.desc+'</small>';b.onclick=()=>{if(item.food){if(item.food.good){p.good++;p.hp=Math.min(150,p.hp+25);p.armor=Math.min(90,p.armor+12);p.power=Math.min(2.2,p.power+.12);p.maxAmmo=Math.min(24,p.maxAmmo+2);p.ammo=Math.min(p.maxAmmo,p.ammo+2);toast('+'+25+' ζωή · +12 ασπίδα · περισσότερες βολές!')}else{if(p.good===0){end(false,'Ενεργοποιήθηκε ο ειδικός κανόνας της αρένας: επέλεξες λιγότερο υγιεινό τρόφιμο πριν αποκτήσεις υγιεινό bonus. Αυτός είναι κανόνας φαντασίας, όχι πραγματικό αποτέλεσμα τροφής.');return}p.hp=Math.max(1,p.hp-22);p.armor=Math.max(0,p.armor-12);toast('Προσωρινή ποινή αρένας −22 ζωή')}}else if(item.gun){p.power=Math.min(3,p.power+.45);toast('Αναβάθμιση blaster!')}else{p.reserve+=24;toast('+24 ενεργειακές βολές!')}resume();updateHUD()};div.appendChild(b)});let skip=document.createElement('button');skip.className='secondary';skip.textContent='Άφησε τα αντικείμενα';skip.onclick=resume;div.parentElement.appendChild(skip)}function action(){if(state!=='play')return;let near=boxes.filter(b=>!b.used&&dist(p,b)<85).sort((a,b)=>dist(p,a)-dist(p,b))[0];if(near){openBox(near);return}if(p.inCar>=0){p.inCar=-1;toast('Βγήκες από το όχημα');return}let ci=cars.findIndex(c=>dist(p,c)<90);if(ci>=0){p.inCar=ci;toast('🚙 Οδήγησε με WASD / βελάκια');return}toast('Πλησίασε ένα κουτί ή ένα αυτοκίνητο')}function reload(){if(state!=='play'||p.reload>0||p.ammo>=p.maxAmmo||p.reserve<=0)return;p.reload=1.2;toast('Γέμισμα...')}function shoot(){if(state!=='play'||p.reload>0||p.fire>0)return;if(p.ammo<=0){reload();return}p.ammo--;p.fire=.19;let tx=mouse.x*devicePixelRatio+camera.x,ty=mouse.y*devicePixelRatio+camera.y,angle=Math.atan2(ty-p.y,tx-p.x);bullets.push({x:p.x,y:p.y,vx:Math.cos(angle)*850,vy:Math.sin(angle)*850,owner:'p',life:1.6,damage:14*p.power});updateHUD()}
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==='KeyE')action();if(e.code==='KeyR')reload();if(e.code==='KeyP'){if(state==='play')show('⏸ ΠΑΥΣΗ','Πάρε μια ανάσα και συνέχισε όταν είσαι έτοιμος.',[{label:'ΣΥΝΕΧΕΙΑ',fn:resume},{label:'ΕΠΑΝΕΚΚΙΝΗΣΗ',fn:start,secondary:true}])}if(e.code==='Space')shoot()});addEventListener('keyup',e=>keys[e.code]=false);canvas.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')shoot()});document.querySelectorAll('[data-key]').forEach(b=>{const key=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>keys[key]=false))});document.getElementById('action').onclick=action;document.getElementById('reload').onclick=reload;document.getElementById('shoot').addEventListener('pointerdown',e=>{e.preventDefault();if(bot&&p){mouse.x=(bot.x-camera.x)/devicePixelRatio;mouse.y=(bot.y-camera.y)/devicePixelRatio;shoot()}});
function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}function render(){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#091425';ctx.fillRect(0,0,W,H);if(!p)return;camera.x=clamp(p.x-W/2,0,Math.max(0,world.w-W));camera.y=clamp(p.y-H/2,0,Math.max(0,world.h-H));ctx.save();ctx.translate(-camera.x,-camera.y);ctx.fillStyle='#172f35';ctx.fillRect(0,0,world.w,world.h);ctx.strokeStyle='#315358';ctx.lineWidth=3;for(let x=0;x<world.w;x+=90){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke()}for(let y=0;y<world.h;y+=90){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke()}ctx.fillStyle='#344650';ctx.fillRect(0,700,world.w,130);ctx.fillRect(1010,0,130,world.h);ctx.strokeStyle='#b7bd8e';ctx.setLineDash([38,24]);ctx.beginPath();ctx.moveTo(0,765);ctx.lineTo(world.w,765);ctx.moveTo(1075,0);ctx.lineTo(1075,world.h);ctx.stroke();ctx.setLineDash([]);hills.forEach(h=>{circle(h.x,h.y,h.r,'#244d48');circle(h.x-14,h.y-15,h.r*.72,'#30645a');circle(h.x-30,h.y-25,h.r*.34,'#467a6b')});rocks.forEach(r=>{circle(r.x,r.y,r.r,'#607177');circle(r.x-5,r.y-6,r.r*.55,'#82918e')});boxes.forEach(b=>{if(b.used)return;ctx.shadowBlur=17;ctx.shadowColor='#f2c65b';ctx.fillStyle='#e2ad42';ctx.fillRect(b.x-19,b.y-19,38,38);ctx.shadowBlur=0;ctx.strokeStyle='#fff0aa';ctx.lineWidth=3;ctx.strokeRect(b.x-19,b.y-19,38,38);ctx.fillStyle='#442d12';ctx.font='bold 23px system-ui';ctx.textAlign='center';ctx.fillText('?',b.x,b.y+8)});cars.forEach((c,i)=>{ctx.save();ctx.translate(c.x,c.y);ctx.fillStyle=p.inCar===i?'#62ebd4':'#eb6c6c';ctx.fillRect(-31,-18,62,36);ctx.fillStyle='#16354d';ctx.fillRect(-9,-15,24,30);ctx.fillStyle='#111';ctx.fillRect(-23,-23,15,7);ctx.fillRect(12,-23,15,7);ctx.fillRect(-23,16,15,7);ctx.fillRect(12,16,15,7);ctx.restore()});bullets.forEach(b=>circle(b.x,b.y,5,b.owner==='p'?'#74fbd8':'#ff7588'));circle(bot.x,bot.y,23,'#fa5b77');circle(bot.x,bot.y,15,'#7d2b52');ctx.fillStyle='white';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText('AI',bot.x,bot.y+5);ctx.fillStyle='#101826';ctx.fillRect(bot.x-31,bot.y-42,62,8);ctx.fillStyle='#ff5e80';ctx.fillRect(bot.x-31,bot.y-42,62*clamp(bot.hp/100,0,1),8);circle(p.x,p.y,23,'#69f7d2');circle(p.x,p.y,15,'#167e7b');ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.fillText('YOU',p.x,p.y+5);if(p.inCar<0){let a=Math.atan2(mouse.y*devicePixelRatio+camera.y-p.y,mouse.x*devicePixelRatio+camera.x-p.x);ctx.strokeStyle='#c2fff2';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+Math.cos(a)*35,p.y+Math.sin(a)*35);ctx.stroke()}ctx.restore();let cx=mouse.x*devicePixelRatio,cy=mouse.y*devicePixelRatio;ctx.strokeStyle='#ffffffaa';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx-9,cy);ctx.lineTo(cx+9,cy);ctx.moveTo(cx,cy-9);ctx.lineTo(cx,cy+9);ctx.stroke()}
function tick(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;if(state==='play'){elapsed+=dt;let dx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),dy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0),mag=Math.hypot(dx,dy)||1,spd=p.inCar>=0?390:240;p.x=clamp(p.x+dx/mag*spd*dt,30,world.w-30);p.y=clamp(p.y+dy/mag*spd*dt,30,world.h-30);if(p.inCar>=0){cars[p.inCar].x=p.x;cars[p.inCar].y=p.y}p.fire=Math.max(0,p.fire-dt);if(p.reload>0){p.reload-=dt;if(p.reload<=0){let n=Math.min(p.maxAmmo-p.ammo,p.reserve);p.ammo+=n;p.reserve-=n;toast('Έτοιμος!')}}let d=dist(p,bot);if(d>220){bot.x+=((p.x-bot.x)/d)*115*dt;bot.y+=((p.y-bot.y)/d)*115*dt}if(d<140){bot.x-=((p.x-bot.x)/d)*75*dt;bot.y-=((p.y-bot.y)/d)*75*dt}bot.fire-=dt;if(bot.fire<=0&&d<650){bot.fire=1.25;let a=Math.atan2(p.y-bot.y,p.x-bot.x)+rand(-.13,.13);bullets.push({x:bot.x,y:bot.y,vx:Math.cos(a)*440,vy:Math.sin(a)*440,owner:'bot',life:1.8,damage:10})}bullets=bullets.filter(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<=0)return false;if(b.owner==='p'&&dist(b,bot)<25){bot.hp-=b.damage;if(bot.hp<=0){end(true,'Νίκησες τον αντίπαλο με στρατηγική, κίνηση και έξυπνες επιλογές!')}return false}if(b.owner==='bot'&&dist(b,p)<23){let dmg=b.damage;if(p.armor>0){let absorb=Math.min(p.armor,dmg*.65);p.armor-=absorb;dmg-=absorb}p.hp-=dmg;if(p.hp<=0)end(false,'Ο αντίπαλος κέρδισε αυτή τη μάχη. Δοκίμασε ξανά!');return false}return true});updateHUD()}render();if(noticeTime&&t>noticeTime){document.getElementById('toast').style.opacity=0;noticeTime=0}requestAnimationFrame(tick)}menu();requestAnimationFrame(tick)})();
</script></body></html>
